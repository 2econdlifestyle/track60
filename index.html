<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수급 대시보드</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--border:#2a2d3a;--text:#e2e8f0;--muted:#7c839a;--accent:#4f8ef7;--up:#34d399;--down:#f87171;--badge:#2d3348;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;font-size:14px;}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
header h1{font-size:15px;font-weight:600;}
#rt-status{font-size:12px;color:var(--muted);}
#last-updated{margin-left:auto;color:var(--muted);font-size:12px;}
.hbtn{background:var(--badge);border:1px solid var(--border);color:var(--text);padding:4px 11px;border-radius:6px;cursor:pointer;font-size:12px;}
.hbtn:hover{background:var(--accent);border-color:var(--accent);}
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 20px;background:var(--surface);}
.tab{padding:10px 16px;cursor:pointer;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab:hover:not(.active){color:var(--text);}
.panel{display:none;padding:20px;}
.panel.active{display:block;}
.stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;}
.stat-box .lbl{font-size:11px;color:var(--muted);}
.stat-box .val{font-size:18px;font-weight:700;margin-top:2px;}
.sec-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 10px;}
.sec-title:first-child{margin-top:0;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{text-align:left;padding:8px 12px;color:var(--muted);font-size:12px;font-weight:500;border-bottom:1px solid var(--border);}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tbody tr:hover td{background:rgba(79,142,247,.04);}
.investor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;}
.investor-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.investor-card-head{padding:10px 14px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px;display:flex;align-items:center;}
.investor-card table{width:100%;border-collapse:collapse;}
.investor-card td{padding:7px 14px;border-bottom:1px solid var(--border);font-size:13px;}
.investor-card tr:last-child td{border-bottom:none;}
.rank{color:var(--muted);width:28px;}
.amount{text-align:right;font-variant-numeric:tabular-nums;}
.theme-tag{font-size:11px;color:var(--muted);margin-top:2px;}
.card-view-toggle{display:flex;border:1px solid var(--border);border-radius:5px;overflow:hidden;margin-left:auto;}
.card-view-btn{padding:3px 10px;font-size:11px;background:none;border:none;color:var(--muted);cursor:pointer;}
.card-view-btn.active{background:var(--accent);color:#fff;}
.card-view-btn:hover:not(.active){background:var(--badge);color:var(--text);}
.card-chart-view{padding:14px;}
.period-selector{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.period-selector select{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px;}
.period-selector label{color:var(--muted);font-size:12px;}
.month-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.month-tab{padding:4px 12px;background:var(--badge);border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:12px;color:var(--muted);}
.month-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.prog-market{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.prog-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;flex:1;min-width:120px;}
.prog-box .lbl{font-size:11px;color:var(--muted);margin-bottom:4px;}
.prog-box .pval{font-size:16px;font-weight:700;}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.badge-in{background:rgba(52,211,153,.15);color:var(--up);}
.badge-out{background:rgba(248,113,113,.15);color:var(--down);}
.up{color:var(--up);}.down{color:var(--down);}.muted{color:var(--muted);}
.stock-link{cursor:pointer;}
.stock-link:hover b,.stock-link:hover{color:var(--accent);}
.empty{color:var(--muted);padding:30px;text-align:center;font-size:13px;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading{color:var(--muted);padding:40px;text-align:center;}
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:center;justify-content:center;}
#modal-overlay.open{display:flex;}
#modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:min(740px,95vw);max-height:82vh;overflow-y:auto;position:relative;}
#modal-close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;}
#modal-close:hover{color:var(--text);}
#modal-title{font-size:15px;font-weight:600;margin-bottom:16px;padding-right:30px;}
.mstat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.mstat{background:var(--badge);border:1px solid var(--border);border-radius:8px;padding:10px 16px;}
.mstat .lbl{font-size:11px;color:var(--muted);}
.mstat .val{font-size:16px;font-weight:600;margin-top:3px;}
#notif-btn{font-size:18px;background:none;border:none;cursor:pointer;padding:0 4px;opacity:.4;}
#notif-btn.granted{opacity:1;}
</style>
</head>
<body>
<div id="modal-overlay">
  <div id="modal">
    <button id="modal-close" onclick="closeModal()">&#x2715;</button>
    <div id="modal-title"></div>
    <div id="modal-stats" class="mstat-row"></div>
    <div id="modal-history"></div>
  </div>
</div>

<header>
  <span>&#128202;</span>
  <h1>수급 대시보드</h1>
  <span id="rt-status"></span>
  <button id="notif-btn" onclick="requestNotif()" title="브라우저 알림 허용">&#128276;</button>
  <span id="last-updated" class="muted">&#8212;</span>
  <button class="hbtn" onclick="loadAll()">새로고침</button>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('realtime',this)">&#128225; 실시간 현황</div>
  <div class="tab" onclick="switchTab('program',this)">&#129302; 프로그램 수급</div>
  <div class="tab" onclick="switchTab('daily',this)">&#128202; 투자자 TOP10</div>
  <div class="tab" onclick="switchTab('analysis',this)">&#128200; 분석 결과</div>
</div>

<div id="panel-realtime" class="panel active">
  <div id="rt-stats" class="stat-row"></div>
  <div class="sec-title">편입 중</div>
  <div id="rt-active"><div class="loading"><span class="spinner"></span>불러오는 중...</div></div>
  <div class="sec-title" style="margin-top:24px">오늘 이탈</div>
  <div id="rt-exited"></div>
</div>

<div id="panel-program" class="panel">
  <div id="prog-market" class="prog-market"></div>
  <div class="sec-title">프로그램 순매수 상위</div>
  <div id="prog-table"><div class="loading"><span class="spinner"></span>불러오는 중...</div></div>
</div>

<div id="panel-daily" class="panel">
  <div class="period-selector">
    <label>날짜</label>
    <select id="daily-date-sel" onchange="renderDaily()"></select>
  </div>
  <div id="daily-grid" class="investor-grid"><div class="loading"><span class="spinner"></span>불러오는 중...</div></div>
</div>

<div id="panel-analysis" class="panel">
  <div class="period-selector">
    <label>기간</label>
    <select id="analysis-period-sel" onchange="onPeriodChange()"></select>
    <label style="margin-left:12px">유형</label>
    <select id="analysis-type-sel" onchange="onPeriodChange()">
      <option value="total">전체기간</option>
      <option value="monthly">월별</option>
    </select>
  </div>
  <div id="month-tabs" class="month-tabs" style="display:none"></div>
  <div id="analysis-grid" class="investor-grid"><div class="loading"><span class="spinner"></span>불러오는 중...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script>
var SUPABASE_URL = "https://thhoydcjdxkvtpquaqwk.supabase.co";
var SUPABASE_KEY = "sb_publishable_Y_iy6oC680CLENegwsp0Dg_hMiaih0b";
var db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ── 유틸 ──────────────────────────────────────────────────────
function today8() {
  var kst = new Date(Date.now() + 9 * 3600 * 1000);
  return kst.toISOString().slice(0,10).replace(/-/g,"");
}

function fmtAmount(raw) {
  if (raw == null) return "—";
  var sign = raw >= 0 ? "▲" : "▽";
  var a = Math.abs(raw);
  var jo = Math.floor(a / 1000000);
  var eok = Math.floor((a % 1000000) / 100);
  var chun = Math.floor((a % 100) / 10);
  if (!jo && !eok && !chun) return sign + a + "백만원";
  var p = [];
  if (jo) p.push(jo + "조");
  if (eok) p.push(eok + "억");
  if (chun) p.push(chun + "천만원");
  else if (p.length) p[p.length-1] += "원";
  return sign + p.join(" ");
}

function fmtDur(entryTime) {
  if (!entryTime) return "—";
  var parts = entryTime.split(":");
  var eh = Number(parts[0]), em = Number(parts[1]);
  var now = new Date();
  var diff = (now.getHours() * 60 + now.getMinutes()) - (eh * 60 + em);
  if (diff <= 0) return "0분";
  if (diff < 60) return diff + "분";
  return Math.floor(diff/60) + "시간 " + (diff%60) + "분";
}

function calcDur(et, xt) {
  if (!et || !xt) return "—";
  var ep = et.split(":"), xp = xt.split(":");
  var d = (Number(xp[0])*60 + Number(xp[1])) - (Number(ep[0])*60 + Number(ep[1]));
  if (d <= 0) return "—";
  if (d < 60) return d + "분";
  return Math.floor(d/60) + "시간 " + (d%60) + "분";
}

function fmtRate(v) {
  if (v == null) return "—";
  var cls = v >= 0 ? "up" : "down";
  var s = v >= 0 ? "+" : "";
  return '<span class="' + cls + '">' + s + v + '%</span>';
}

function fmtPnl(ep, cp) {
  if (!ep || !cp) return "—";
  var pnl = (cp - ep) / ep * 100;
  var cls = pnl >= 0 ? "up" : "down";
  var s = pnl >= 0 ? "+" : "";
  return '<span class="' + cls + '">' + s + pnl.toFixed(1) + '%</span>';
}

function fmtNetBuy(v) {
  if (v == null) return "—";
  var cls = v >= 0 ? "up" : "down";
  var s = v >= 0 ? "+" : "";
  return '<span class="' + cls + '">' + s + v.toLocaleString() + '백만</span>';
}

function setUpdated() {
  document.getElementById("last-updated").textContent = "갱신: " + new Date().toLocaleTimeString("ko-KR");
}

// ── 탭 전환 ───────────────────────────────────────────────────
function switchTab(name, el) {
  var tabs = document.querySelectorAll(".tab");
  var panels = document.querySelectorAll(".panel");
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove("active");
  for (var i = 0; i < panels.length; i++) panels[i].classList.remove("active");
  el.classList.add("active");
  document.getElementById("panel-" + name).classList.add("active");
}

// ── 브라우저 알림 ──────────────────────────────────────────────
function updateNotifBtn() {
  var btn = document.getElementById("notif-btn");
  if (!("Notification" in window)) { btn.style.display = "none"; return; }
  if (Notification.permission === "granted") btn.classList.add("granted");
  else btn.classList.remove("granted");
}

function requestNotif() {
  if (!("Notification" in window)) return;
  Notification.requestPermission().then(function() { updateNotifBtn(); });
}

function showNotif(title, body) {
  if (Notification.permission === "granted") {
    new Notification(title, { body: body });
  }
}
updateNotifBtn();

// ── 모달 ──────────────────────────────────────────────────────
function closeModal() {
  document.getElementById("modal-overlay").classList.remove("open");
}
document.getElementById("modal-overlay").addEventListener("click", function(e) {
  if (e.target === document.getElementById("modal-overlay")) closeModal();
});

function openModal(code, name) {
  document.getElementById("modal-overlay").classList.add("open");
  document.getElementById("modal-title").textContent = name + "  (" + code + ")";
  document.getElementById("modal-stats").innerHTML = "";
  document.getElementById("modal-history").innerHTML = '<div class="loading"><span class="spinner"></span>불러오는 중...</div>';

  db.from("bot_entries").select("*").eq("code", code)
    .order("date", { ascending: false }).order("entry_time", { ascending: false }).limit(200)
    .then(function(res) {
      var data = res.data || [];
      if (!data.length) {
        document.getElementById("modal-history").innerHTML = '<div class="empty">편입 이력 없음</div>';
        return;
      }
      var days = new Set(data.map(function(r) { return r.date; })).size;
      var withExit = data.filter(function(r) { return r.entry_time && r.exit_time; });
      var avgDur = null;
      if (withExit.length) {
        var total = withExit.reduce(function(s, r) {
          var ep = r.entry_time.split(":"), xp = r.exit_time.split(":");
          return s + (Number(xp[0])*60 + Number(xp[1])) - (Number(ep[0])*60 + Number(ep[1]));
        }, 0);
        avgDur = Math.round(total / withExit.length);
      }
      var statsHtml = '<div class="mstat"><div class="lbl">편입 발생일</div><div class="val">' + days + '일</div></div>';
      statsHtml += '<div class="mstat"><div class="lbl">수 편입 횟수</div><div class="val">' + data.length + '회</div></div>';
      if (avgDur !== null) statsHtml += '<div class="mstat"><div class="lbl">평균 유지시간</div><div class="val">' + avgDur + '분</div></div>';
      document.getElementById("modal-stats").innerHTML = statsHtml;

      var rows = data.map(function(r) {
        var dur = calcDur(r.entry_time, r.exit_time);
        var ds = r.date ? (r.date.slice(0,4) + "-" + r.date.slice(4,6) + "-" + r.date.slice(6)) : "—";
        var badge = r.status === "in"
          ? '<span class="badge badge-in">편입</span>'
          : '<span class="badge badge-out">이탈</span>';
        var ep = r.entry_price != null ? r.entry_price.toLocaleString() : "—";
        var xp = r.exit_price != null ? r.exit_price.toLocaleString() : "—";
        return "<tr><td class='muted' style='font-size:12px'>" + ds + "</td><td>" + badge + "</td><td>" + (r.entry_time||"—") + "</td><td>" + ep + "</td><td>" + (r.exit_time||"—") + "</td><td>" + xp + "</td><td class='muted'>" + dur + "</td></tr>";
      }).join("");

      document.getElementById("modal-history").innerHTML =
        "<table class='tbl'><thead><tr><th>날짜</th><th>상태</th><th>편입시각</th><th>편입가</th><th>이탈시각</th><th>이탈가</th><th>유지</th></tr></thead><tbody>" + rows + "</tbody></table>";
    });
}

// ── 데이터 캐시 ───────────────────────────────────────────────
var _active = [], _exited = [], _program = null, _daily = [], _analysis = [];

// ── 실시간 현황 ───────────────────────────────────────────────
function loadRealtime() {
  var t = today8();
  return Promise.all([
    db.from("realtime_status").select("*").eq("date", t).order("entry_time"),
    db.from("bot_entries").select("*").eq("date", t).eq("status","out").order("exit_time", { ascending: false })
  ]).then(function(results) {
    _active = results[0].data || [];
    _exited = results[1].data || [];
  });
}

function renderRealtime() {
  document.getElementById("rt-stats").innerHTML =
    '<div class="stat-box"><div class="lbl">편입 중</div><div class="val up">' + _active.length + '개</div></div>' +
    '<div class="stat-box"><div class="lbl">오늘 이탈</div><div class="val down">' + _exited.length + '개</div></div>' +
    '<div class="stat-box"><div class="lbl">옵 포착</div><div class="val">' + (_active.length + _exited.length) + '개</div></div>';

  var actEl = document.getElementById("rt-active");
  if (!_active.length) {
    actEl.innerHTML = '<div class="empty">현재 편입 중인 종목 없음</div>';
  } else {
    var rows = _active.map(function(s) {
      var sn = (s.name || s.code).replace(/'/g, "\\'");
      return "<tr><td class='stock-link' onclick=\"openModal('" + s.code + "','" + sn + "')\">" +
        "<b>" + (s.name||s.code) + "</b><br><span class='muted' style='font-size:11px'>" + s.code + " &middot; " + (s.condition_name||"") + "</span></td>" +
        "<td>" + (s.entry_time||"—") + "</td>" +
        "<td class='dur-cell' data-entry='" + (s.entry_time||"") + "'>" + fmtDur(s.entry_time) + "</td>" +
        "<td>" + (s.entry_price != null ? s.entry_price.toLocaleString() : "—") + "</td>" +
        "<td>" + (s.current_price != null ? s.current_price.toLocaleString() : "—") + "</td>" +
        "<td>" + fmtRate(s.change_rate) + "</td>" +
        "<td>" + fmtPnl(s.entry_price, s.current_price) + "</td>" +
        "<td class='muted'>" + (s.strength != null ? Number(s.strength).toFixed(1) : "—") + "</td></tr>";
    }).join("");
    actEl.innerHTML = "<table class='tbl'><thead><tr><th>종목</th><th>편입시각</th><th>유지시간</th><th>편입가</th><th>현재가</th><th>등락률</th><th>수익률</th><th>강도</th></tr></thead><tbody>" + rows + "</tbody></table>";
  }

  var exitEl = document.getElementById("rt-exited");
  if (!_exited.length) {
    exitEl.innerHTML = '<div class="empty">오늘 이탈 종목 없음</div>';
  } else {
    var rows2 = _exited.map(function(e) {
      var dur = calcDur(e.entry_time, e.exit_time);
      var sn = (e.name || e.code).replace(/'/g, "\\'");
      return "<tr><td class='stock-link' onclick=\"openModal('" + e.code + "','" + sn + "')\">" +
        "<b>" + (e.name||e.code) + "</b><br><span class='muted' style='font-size:11px'>" + e.code + "</span></td>" +
        "<td class='muted'>" + (e.entry_time||"—") + " → " + (e.exit_time||"—") + "</td>" +
        "<td class='muted'>" + dur + "</td>" +
        "<td>" + (e.entry_price != null ? e.entry_price.toLocaleString() : "—") + "</td>" +
        "<td>" + fmtPnl(e.entry_price, e.exit_price) + "</td></tr>";
    }).join("");
    exitEl.innerHTML = "<table class='tbl'><thead><tr><th>종목</th><th>편입 → 이탈</th><th>유지</th><th>편입가</th><th>수익률</th></tr></thead><tbody>" + rows2 + "</tbody></table>";
  }
}

setInterval(function() {
  document.querySelectorAll(".dur-cell").forEach(function(td) {
    td.textContent = fmtDur(td.dataset.entry);
  });
}, 1000);

// ── 프로그램 수급 ──────────────────────────────────────────────
function loadProgram() {
  return db.from("program_summary").select("*").eq("date", today8())
    .order("recorded_at", { ascending: false }).limit(1)
    .then(function(res) {
      var data = res.data || [];
      _program = data.length ? data[0] : null;
    });
}

function renderProgram() {
  if (!_program) {
    document.getElementById("prog-market").innerHTML = "";
    document.getElementById("prog-table").innerHTML = '<div class="empty">오늘 프로그램 수급 데이터 없음 (장중 5분 간격 갱신)</div>';
    return;
  }
  var ts = new Date(_program.recorded_at).toLocaleTimeString("ko-KR");
  var tc = (_program.total_net||0) >= 0 ? "up" : "down";
  var ac = (_program.arb_net||0) >= 0 ? "up" : "down";
  var nc = (_program.non_arb_net||0) >= 0 ? "up" : "down";
  document.getElementById("prog-market").innerHTML =
    '<div class="prog-box"><div class="lbl">전체 순매수</div><div class="pval ' + tc + '">' + fmtAmount(_program.total_net) + '</div></div>' +
    '<div class="prog-box"><div class="lbl">차익</div><div class="pval ' + ac + '">' + fmtAmount(_program.arb_net) + '</div></div>' +
    '<div class="prog-box"><div class="lbl">비차익</div><div class="pval ' + nc + '">' + fmtAmount(_program.non_arb_net) + '</div></div>' +
    '<div class="prog-box"><div class="lbl">기준시각</div><div class="pval" style="font-size:14px">' + ts + '</div></div>';

  var stocks = _program.stocks || [];
  if (!stocks.length) {
    document.getElementById("prog-table").innerHTML = '<div class="empty">종목 데이터 없음</div>';
    return;
  }
  var rows = stocks.slice(0,50).map(function(s) {
    var sn = (s.name||s.code).replace(/'/g, "\\'");
    return "<tr><td class='rank'>" + s.rank + "</td>" +
      "<td class='stock-link' onclick=\"openModal('" + s.code + "','" + sn + "')\">" + (s.name||s.code) + "<br><span class='muted' style='font-size:11px'>" + s.code + " &middot; " + (s.market||"") + "</span></td>" +
      "<td class='amount'>" + fmtNetBuy(s.net_buy) + "</td></tr>";
  }).join("");
  document.getElementById("prog-table").innerHTML =
    "<table class='tbl'><thead><tr><th>순위</th><th>종목</th><th class='amount'>순매수(백만원)</th></tr></thead><tbody>" + rows + "</tbody></table>";
}

// ── 차트 ──────────────────────────────────────────────────────
var _charts = {}, _chartData = {};

function renderBarChart(id, labels, amounts) {
  if (_charts[id]) { _charts[id].destroy(); delete _charts[id]; }
  var ctx = document.getElementById(id);
  if (!ctx) return;
  _charts[id] = new Chart(ctx, {
    type: "bar",
    data: { labels: labels, datasets: [{ data: amounts,
      backgroundColor: amounts.map(function(v) { return v >= 0 ? "rgba(52,211,153,.5)" : "rgba(248,113,113,.5)"; }),
      borderColor: amounts.map(function(v) { return v >= 0 ? "#34d399" : "#f87171"; }),
      borderWidth: 1, borderRadius: 3 }]},
    options: { indexAxis: "y", responsive: true,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(c) { return "  " + fmtAmount(c.raw); }}}},
      scales: {
        x: { ticks: { color: "#7c839a", font: { size: 10 }}, grid: { color: "#2a2d3a" }},
        y: { ticks: { color: "#e2e8f0", font: { size: 12 }}, grid: { color: "rgba(0,0,0,0)" }}}}
  });
}

function showCardView(cardId, view, btn) {
  var card = document.getElementById(cardId);
  card.querySelector(".card-table-view").style.display = view === "table" ? "" : "none";
  card.querySelector(".card-chart-view").style.display = view === "chart" ? "" : "none";
  card.querySelectorAll(".card-view-btn").forEach(function(b) { b.classList.remove("active"); });
  btn.classList.add("active");
  if (view === "chart" && _chartData[cardId]) {
    renderBarChart("chart-" + cardId, _chartData[cardId].labels, _chartData[cardId].amounts);
  }
}

function makeInvestorCard(cardId, type, items) {
  _chartData[cardId] = {
    labels: items.map(function(r) { return r.name || r.code; }).reverse(),
    amounts: items.map(function(r) { return r.amount; }).reverse()
  };
  var trs = items.map(function(r) {
    var sn = (r.name||r.code).replace(/'/g, "\\'");
    var themes = r.themes ? '<div class="theme-tag">[' + r.themes + ']</div>' : "";
    var cls = (r.amount||0) >= 0 ? "up" : "down";
    return "<tr><td class='rank'>" + r.rank + "</td>" +
      "<td class='stock-link' onclick=\"openModal('" + r.code + "','" + sn + "')\">" + (r.name||r.code) + "<br><span class='muted' style='font-size:11px'>" + r.code + "</span>" + themes + "</td>" +
      "<td class='amount " + cls + "'>" + fmtAmount(r.amount) + "</td></tr>";
  }).join("");
  return "<div class='investor-card' id='" + cardId + "'>" +
    "<div class='investor-card-head'><span>" + type + "</span>" +
    "<div class='card-view-toggle'>" +
    "<button class='card-view-btn active' onclick=\"showCardView('" + cardId + "','table',this)\">표</button>" +
    "<button class='card-view-btn' onclick=\"showCardView('" + cardId + "','chart',this)\">차트</button>" +
    "</div></div>" +
    "<div class='card-table-view'><table><tbody>" + trs + "</tbody></table></div>" +
    "<div class='card-chart-view' style='display:none'><canvas id='chart-" + cardId + "'></canvas></div>" +
    "</div>";
}

// ── 투자자 TOP10 ──────────────────────────────────────────────
function loadDaily() {
  return db.from("investor_daily").select("*")
    .order("date", { ascending: false }).order("investor_type").order("rank").limit(500)
    .then(function(res) { _daily = res.data || []; });
}

function renderDailyDateSel() {
  var dates = [];
  var seen = {};
  _daily.forEach(function(r) { if (!seen[r.date]) { seen[r.date] = true; dates.push(r.date); }});
  dates.sort().reverse();
  document.getElementById("daily-date-sel").innerHTML = dates.map(function(d) {
    return "<option value='" + d + "'>" + d.slice(0,4) + "-" + d.slice(4,6) + "-" + d.slice(6) + "</option>";
  }).join("");
}

function renderDaily() {
  var date = document.getElementById("daily-date-sel").value;
  var rows = _daily.filter(function(r) { return r.date === date; });
  if (!rows.length) { document.getElementById("daily-grid").innerHTML = '<div class="empty">데이터 없음</div>'; return; }
  var types = [], seen = {};
  rows.forEach(function(r) { if (!seen[r.investor_type]) { seen[r.investor_type] = true; types.push(r.investor_type); }});
  document.getElementById("daily-grid").innerHTML = types.map(function(t, i) {
    return makeInvestorCard("daily-card-" + i, t, rows.filter(function(r) { return r.investor_type === t; }).slice(0,10));
  }).join("");
}

// ── 분석 결과 ─────────────────────────────────────────────────
function loadAnalysis() {
  return db.from("investor_analysis").select("*")
    .order("period_end", { ascending: false }).order("investor_type").order("rank").limit(2000)
    .then(function(res) { _analysis = res.data || []; });
}

function renderAnalysisPeriodSel() {
  var seen = {}, periods = [];
  _analysis.forEach(function(r) {
    var key = r.period_start + "_" + r.period_end;
    if (!seen[key]) {
      seen[key] = true;
      var label = r.period_start.slice(0,4) + "-" + r.period_start.slice(4,6) + "-" + r.period_start.slice(6) +
        " ~ " + r.period_end.slice(0,4) + "-" + r.period_end.slice(4,6) + "-" + r.period_end.slice(6);
      periods.push({ key: key, label: label });
    }
  });
  document.getElementById("analysis-period-sel").innerHTML = periods.map(function(p) {
    return "<option value='" + p.key + "'>" + p.label + "</option>";
  }).join("");
}

function onPeriodChange() {
  var type = document.getElementById("analysis-type-sel").value;
  if (type === "monthly") {
    var pv = document.getElementById("analysis-period-sel").value;
    var ps = pv.split("_")[0], pe = pv.split("_")[1];
    var months = [], seenM = {};
    _analysis.forEach(function(r) {
      if (r.period_start===ps && r.period_end===pe && r.is_monthly && !seenM[r.month]) {
        seenM[r.month] = true; months.push(r.month);
      }
    });
    months.sort();
    var tabs = document.getElementById("month-tabs");
    tabs.style.display = months.length ? "flex" : "none";
    tabs.innerHTML = months.map(function(m, i) {
      return "<div class='month-tab" + (i===0?" active":"") + "' onclick=\"selectMonth('" + m + "',this)\">" + m + "</div>";
    }).join("");
  } else {
    document.getElementById("month-tabs").style.display = "none";
  }
  renderAnalysis();
}

function selectMonth(m, el) {
  document.querySelectorAll(".month-tab").forEach(function(t) { t.classList.remove("active"); });
  el.classList.add("active");
  renderAnalysis();
}

function renderAnalysis() {
  var pv = document.getElementById("analysis-period-sel").value;
  if (!pv) { document.getElementById("analysis-grid").innerHTML = '<div class="empty">데이터 없음</div>'; return; }
  var ps = pv.split("_")[0], pe = pv.split("_")[1];
  var isM = document.getElementById("analysis-type-sel").value === "monthly";
  var rows;
  if (isM) {
    var active = document.querySelector(".month-tab.active");
    var month = active ? active.textContent.trim() : null;
    rows = _analysis.filter(function(r) { return r.period_start===ps && r.period_end===pe && r.is_monthly && r.month===month; });
  } else {
    rows = _analysis.filter(function(r) { return r.period_start===ps && r.period_end===pe && !r.is_monthly; });
  }
  if (!rows.length) { document.getElementById("analysis-grid").innerHTML = '<div class="empty">데이터 없음</div>'; return; }
  var types = [], seenT = {};
  rows.forEach(function(r) { if (!seenT[r.investor_type]) { seenT[r.investor_type] = true; types.push(r.investor_type); }});
  document.getElementById("analysis-grid").innerHTML = types.map(function(t, i) {
    return makeInvestorCard("analysis-card-" + i, t, rows.filter(function(r) { return r.investor_type === t; }));
  }).join("");
}

// ── 전체 로드 ─────────────────────────────────────────────────
function loadAll() {
  Promise.allSettled([loadRealtime(), loadProgram(), loadDaily(), loadAnalysis()]).then(function(results) {
    results.forEach(function(r, i) {
      if (r.status === "rejected") console.error(["realtime","program","daily","analysis"][i], r.reason);
    });
    renderRealtime();
    renderProgram();
    renderDailyDateSel(); renderDaily();
    renderAnalysisPeriodSel(); onPeriodChange();
    setUpdated();
  });
}

// ── Realtime 구독 ─────────────────────────────────────────────
db.channel("rt-status-ch")
  .on("postgres_changes", { event: "INSERT", schema: "public", table: "realtime_status" }, function(payload) {
    var s = payload.new;
    showNotif("편입: " + (s.name||s.code), (s.condition_name||"") + " | " + (s.entry_time||""));
    loadRealtime().then(function() { renderRealtime(); setUpdated(); });
  })
  .on("postgres_changes", { event: "DELETE", schema: "public", table: "realtime_status" }, function() {
    loadRealtime().then(function() { renderRealtime(); setUpdated(); });
  })
  .subscribe(function(status) {
    var el = document.getElementById("rt-status");
    if (el) el.textContent = status === "SUBSCRIBED" ? "🟢 실시간" : "";
  });

db.channel("bot-entries-ch")
  .on("postgres_changes", { event: "*", schema: "public", table: "bot_entries" }, function() {
    loadRealtime().then(function() { renderRealtime(); setUpdated(); });
  })
  .subscribe();

loadAll();
setInterval(loadAll, 60000);
</script>
</body>
</html>
