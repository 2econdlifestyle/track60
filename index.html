<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수급 대시보드</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
    --text: #e2e8f0; --muted: #7c839a; --accent: #4f8ef7;
    --up: #34d399; --down: #f87171; --badge: #2d3348;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; font-size: 14px; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; font-weight: 600; }
  #last-updated { margin-left: auto; color: var(--muted); font-size: 12px; }
  #refresh-btn { background: var(--badge); border: 1px solid var(--border); color: var(--text); padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  #refresh-btn:hover { background: var(--accent); border-color: var(--accent); }

  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); padding: 0 20px; background: var(--surface); }
  .tab { padding: 10px 18px; cursor: pointer; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover:not(.active) { color: var(--text); }

  .panel { display: none; padding: 20px; }
  .panel.active { display: block; }

  .section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }
  .investor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .investor-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .investor-card-head { padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13px; }
  .investor-card table { width: 100%; border-collapse: collapse; }
  .investor-card td { padding: 7px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .investor-card tr:last-child td { border-bottom: none; }
  .rank { color: var(--muted); width: 28px; }
  .amount { text-align: right; font-variant-numeric: tabular-nums; }
  .theme-tag { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .entries-table { width: 100%; border-collapse: collapse; }
  .entries-table th { text-align: left; padding: 8px 12px; color: var(--muted); font-size: 12px; font-weight: 500; border-bottom: 1px solid var(--border); }
  .entries-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .entries-table tr:last-child td { border-bottom: none; }
  .entries-table tr:hover td { background: var(--surface); }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-in  { background: rgba(52,211,153,.15); color: var(--up); }
  .badge-out { background: rgba(248,113,113,.15); color: var(--down); }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .muted { color: var(--muted); }

  .analysis-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .period-selector { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .period-selector select { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 13px; }
  .period-selector label { color: var(--muted); font-size: 12px; }

  .month-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .month-tab { padding: 4px 12px; background: var(--badge); border: 1px solid var(--border); border-radius: 20px; cursor: pointer; font-size: 12px; color: var(--muted); }
  .month-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .empty { color: var(--muted); padding: 30px; text-align: center; font-size: 13px; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading { color: var(--muted); padding: 40px; text-align: center; }
</style>
</head>
<body>

<header>
  <span>📊</span>
  <h1>수급 대시보드</h1>
  <span id="last-updated" class="muted">—</span>
  <button id="refresh-btn" onclick="loadAll()">새로고침</button>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('realtime', this)">📡 실시간 현황</div>
  <div class="tab" onclick="switchTab('daily', this)">📊 투자자 TOP10</div>
  <div class="tab" onclick="switchTab('analysis', this)">📈 분석 결과</div>
</div>

<!-- ── 실시간 현황 ── -->
<div id="panel-realtime" class="panel active">
  <p class="section-title" id="rt-title">오늘 편입/이탈 현황</p>
  <div id="rt-table"><div class="loading"><span class="spinner"></span>불러오는 중...</div></div>
</div>

<!-- ── 투자자 TOP10 ── -->
<div id="panel-daily" class="panel">
  <div class="period-selector">
    <label>날짜</label>
    <select id="daily-date-sel" onchange="renderDaily()"></select>
  </div>
  <div id="daily-grid" class="investor-grid">
    <div class="loading"><span class="spinner"></span>불러오는 중...</div>
  </div>
</div>

<!-- ── 분석 결과 ── -->
<div id="panel-analysis" class="panel">
  <div class="period-selector">
    <label>기간</label>
    <select id="analysis-period-sel" onchange="onPeriodChange()"></select>
    <label style="margin-left:12px">유형</label>
    <select id="analysis-type-sel" onchange="renderAnalysis()">
      <option value="total">전체기간</option>
      <option value="monthly">월별</option>
    </select>
  </div>
  <div id="month-tabs" class="month-tabs" style="display:none"></div>
  <div id="analysis-grid" class="investor-grid">
    <div class="loading"><span class="spinner"></span>불러오는 중...</div>
  </div>
</div>

<script>
// ── 설정 ──────────────────────────────────────────────────────
const SUPABASE_URL = "https://thhoydcjdxkvtpquaqwk.supabase.co";
const SUPABASE_KEY = "sb_publishable_Y_iy6oC680CLENegwsp0Dg_hMiaih0b";
const REFRESH_SEC  = 30;

// ── 공통 유틸 ─────────────────────────────────────────────────
async function sb(table, params = "") {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  if (!r.ok) throw new Error(`${r.status}`);
  return r.json();
}

function fmtAmount(raw) {
  if (raw == null) return "—";
  const sign = raw >= 0 ? "▲" : "▽";
  const a = Math.abs(raw);
  const jo   = Math.floor(a / 1_000_000);
  const eok  = Math.floor((a % 1_000_000) / 100);
  const chun = Math.floor((a % 100) / 10);
  if (!jo && !eok && !chun) return `${sign}${a}백만원`;
  const parts = [];
  if (jo)   parts.push(`${jo}조`);
  if (eok)  parts.push(`${eok}억`);
  if (chun) parts.push(`${chun}천만원`);
  else if (parts.length) parts[parts.length-1] += "원";
  return sign + parts.join(" ");
}

function today8() {
  return new Date().toISOString().slice(0,10).replace(/-/g,"");
}

function setUpdated() {
  document.getElementById("last-updated").textContent =
    "최종갱신: " + new Date().toLocaleTimeString("ko-KR");
}

// ── 탭 전환 ───────────────────────────────────────────────────
function switchTab(name, el) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  el.classList.add("active");
  document.getElementById("panel-" + name).classList.add("active");
}

// ── 데이터 캐시 ───────────────────────────────────────────────
let _entries = [], _daily = [], _analysis = [];

// ── 실시간 현황 ───────────────────────────────────────────────
async function loadRealtime() {
  _entries = await sb("bot_entries",
    `date=eq.${today8()}&order=updated_at.desc&limit=200`);
}

function renderRealtime() {
  const el = document.getElementById("rt-table");
  if (!_entries.length) { el.innerHTML = '<div class="empty">오늘 데이터 없음</div>'; return; }

  const inCount  = _entries.filter(e => e.status === "in").length;
  const outCount = _entries.filter(e => e.status === "out").length;
  document.getElementById("rt-title").textContent =
    `오늘 편입/이탈 현황  |  편입 중 ${inCount}개 · 이탈 ${outCount}개`;

  const rows = _entries.map(e => {
    const rate = e.change_rate != null
      ? `<span class="${e.change_rate >= 0 ? 'up':'down'}">${e.change_rate >= 0 ? '+':''}${e.change_rate}%</span>`
      : "—";
    const badge = e.status === "in"
      ? '<span class="badge badge-in">편입</span>'
      : '<span class="badge badge-out">이탈</span>';
    const dur = (e.entry_time && e.exit_time)
      ? (() => {
          const [eh,em] = e.entry_time.split(":").map(Number);
          const [xh,xm] = e.exit_time.split(":").map(Number);
          const d = (xh*60+xm) - (eh*60+em);
          return d > 0 ? `${d}분` : "—";
        })() : "—";
    return `<tr>
      <td>${badge}</td>
      <td><b>${e.name||e.code}</b><br><span class="muted" style="font-size:11px">${e.code} · ${e.condition_name||""}</span></td>
      <td>${e.entry_time||"—"}</td>
      <td>${e.entry_price != null ? e.entry_price.toLocaleString() : "—"}</td>
      <td>${rate}</td>
      <td class="muted">${dur}</td>
      <td class="muted">${e.exit_time||"—"}</td>
    </tr>`;
  }).join("");

  el.innerHTML = `<table class="entries-table">
    <thead><tr>
      <th>상태</th><th>종목</th><th>편입시각</th><th>편입가</th><th>등락률</th><th>유지</th><th>이탈시각</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// ── 투자자 TOP10 ──────────────────────────────────────────────
async function loadDaily() {
  _daily = await sb("investor_daily", "order=date.desc,investor_type.asc,rank.asc&limit=500");
}

function renderDailyDateSel() {
  const dates = [...new Set(_daily.map(r => r.date))].sort().reverse();
  const sel = document.getElementById("daily-date-sel");
  sel.innerHTML = dates.map(d =>
    `<option value="${d}">${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6)}</option>`
  ).join("");
}

function renderDaily() {
  const date = document.getElementById("daily-date-sel").value;
  const rows = _daily.filter(r => r.date === date);
  if (!rows.length) {
    document.getElementById("daily-grid").innerHTML = '<div class="empty">데이터 없음</div>';
    return;
  }
  const types = [...new Set(rows.map(r => r.investor_type))];
  document.getElementById("daily-grid").innerHTML = types.map(type => {
    const items = rows.filter(r => r.investor_type === type).slice(0, 10);
    const trs = items.map(r => {
      const themes = r.themes ? `<div class="theme-tag">[${r.themes}]</div>` : "";
      return `<tr>
        <td class="rank">${r.rank}</td>
        <td>${r.name||r.code}<br><span class="muted" style="font-size:11px">${r.code}</span>${themes}</td>
        <td class="amount ${r.amount >= 0 ? 'up':'down'}">${fmtAmount(r.amount)}</td>
      </tr>`;
    }).join("");
    return `<div class="investor-card">
      <div class="investor-card-head">${type}</div>
      <table><tbody>${trs}</tbody></table>
    </div>`;
  }).join("");
}

// ── 분석 결과 ─────────────────────────────────────────────────
async function loadAnalysis() {
  _analysis = await sb("investor_analysis",
    "order=period_end.desc,investor_type.asc,rank.asc&limit=2000");
}

function renderAnalysisPeriodSel() {
  const periods = [...new Map(_analysis.map(r =>
    [`${r.period_start}_${r.period_end}`, `${r.period_start.slice(0,4)}-${r.period_start.slice(4,6)}-${r.period_start.slice(6)} ~ ${r.period_end.slice(0,4)}-${r.period_end.slice(4,6)}-${r.period_end.slice(6)}`]
  )).entries()];
  const sel = document.getElementById("analysis-period-sel");
  sel.innerHTML = periods.map(([v,l]) => `<option value="${v}">${l}</option>`).join("");
}

function onPeriodChange() {
  const type = document.getElementById("analysis-type-sel").value;
  if (type === "monthly") {
    const [ps, pe] = document.getElementById("analysis-period-sel").value.split("_");
    const months = [...new Set(
      _analysis.filter(r => r.period_start===ps && r.period_end===pe && r.is_monthly)
               .map(r => r.month)
    )].sort();
    const tabs = document.getElementById("month-tabs");
    tabs.style.display = months.length ? "flex" : "none";
    tabs.innerHTML = months.map((m,i) =>
      `<div class="month-tab ${i===0?'active':''}" onclick="selectMonth('${m}',this)">${m}</div>`
    ).join("");
  } else {
    document.getElementById("month-tabs").style.display = "none";
  }
  renderAnalysis();
}

function selectMonth(m, el) {
  document.querySelectorAll(".month-tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  renderAnalysis();
}

function renderAnalysis() {
  const [ps, pe] = document.getElementById("analysis-period-sel").value.split("_");
  const typeVal  = document.getElementById("analysis-type-sel").value;
  const isMonthly = typeVal === "monthly";

  let rows;
  if (isMonthly) {
    const activeMTab = document.querySelector(".month-tab.active");
    const month = activeMTab ? activeMTab.dataset.month || activeMTab.textContent.trim() : null;
    rows = _analysis.filter(r =>
      r.period_start===ps && r.period_end===pe && r.is_monthly && r.month===month
    );
  } else {
    rows = _analysis.filter(r =>
      r.period_start===ps && r.period_end===pe && !r.is_monthly
    );
  }

  if (!rows.length) {
    document.getElementById("analysis-grid").innerHTML = '<div class="empty">데이터 없음</div>';
    return;
  }

  const types = [...new Set(rows.map(r => r.investor_type))];
  document.getElementById("analysis-grid").innerHTML = types.map(type => {
    const items = rows.filter(r => r.investor_type === type);
    const trs = items.map(r => {
      const themes = r.themes ? `<div class="theme-tag">[${r.themes}]</div>` : "";
      return `<tr>
        <td class="rank">${r.rank}</td>
        <td>${r.name||r.code}<br><span class="muted" style="font-size:11px">${r.code}</span>${themes}</td>
        <td class="amount ${r.amount >= 0 ? 'up':'down'}">${fmtAmount(r.amount)}</td>
      </tr>`;
    }).join("");
    return `<div class="investor-card">
      <div class="investor-card-head">${type}</div>
      <table><tbody>${trs}</tbody></table>
    </div>`;
  }).join("");
}

// ── 전체 로드 ─────────────────────────────────────────────────
async function loadAll() {
  try {
    await Promise.all([loadRealtime(), loadDaily(), loadAnalysis()]);
    renderRealtime();
    renderDailyDateSel();
    renderDaily();
    renderAnalysisPeriodSel();
    onPeriodChange();
    setUpdated();
  } catch(e) {
    console.error(e);
    document.getElementById("last-updated").textContent = "오류: " + e.message;
  }
}

// 초기 로드 + 30초 자동 갱신
loadAll();
setInterval(loadAll, REFRESH_SEC * 1000);
</script>
</body>
</html>
