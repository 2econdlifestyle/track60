<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>추적 60분</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
:root {
  --bg:#0d1117; --surface:#161b22; --surface2:#1c2128; --border:#30363d;
  --text:#c9d1d9; --muted:#8b949e; --accent:#58a6ff;
  --up:#3fb950; --up-bg:rgba(63,185,80,.12);
  --down:#f85149; --down-bg:rgba(248,81,73,.12);
  --badge:#21262d; --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard','Apple SD Gothic Neo',sans-serif;font-size:14px;line-height:1.5;}

/* ── 헤더 ── */
header {
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:0 24px;
  height:56px;
  display:flex;
  align-items:center;
  gap:14px;
  position:sticky;
  top:0;
  z-index:50;
  backdrop-filter:blur(8px);
}
.logo { display:flex; align-items:center; gap:8px; }
.logo-icon { font-size:20px; }
.logo h1 { font-size:15px; font-weight:600; letter-spacing:-.3px; }
.header-sep { width:1px; height:20px; background:var(--border); }
#rt-status { font-size:12px; display:flex; align-items:center; gap:5px; color:var(--muted); }
.pulse { width:7px; height:7px; border-radius:50%; background:var(--up); animation:pulse 2s infinite; }
.pulse.closed { background:var(--down); animation:none; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }
#last-updated { margin-left:auto; color:var(--muted); font-size:12px; }
.hbtn {
  background:var(--badge); border:1px solid var(--border); color:var(--text);
  padding:5px 14px; border-radius:6px; cursor:pointer; font-size:12px;
  transition:background .15s, border-color .15s;
}
.hbtn:hover { background:var(--accent); border-color:var(--accent); color:#fff; }
#notif-btn { font-size:17px; background:none; border:none; cursor:pointer; opacity:.35; transition:opacity .15s; }
#notif-btn.granted, #notif-btn:hover { opacity:1; }

/* ── 탭 ── */
.tabs {
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:0 24px;
  display:flex;
  gap:4px;
  position:sticky;
  top:56px;
  z-index:40;
}
.tab {
  padding:12px 16px;
  cursor:pointer;
  font-size:13px;
  font-weight:500;
  color:var(--muted);
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  white-space:nowrap;
  transition:color .15s, border-color .15s;
}
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.tab:hover:not(.active) { color:var(--text); }

/* ── 패널 ── */
.panel { display:none; padding:24px; max-width:1400px; margin:0 auto; }
.panel.active { display:block; }

/* ── 섹션 ── */
.sec-title {
  font-size:11px; font-weight:600; color:var(--muted);
  text-transform:uppercase; letter-spacing:.08em;
  margin:24px 0 12px; display:flex; align-items:center; gap:8px;
}
.sec-title:first-child { margin-top:0; }
.sec-title::after { content:''; flex:1; height:1px; background:var(--border); }

/* ── 통계 카드 ── */
.stat-row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
.stat-box {
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px 18px;
  min-width:110px;
  position:relative;
  overflow:hidden;
}
.stat-box::before {
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:var(--accent-color, var(--accent));
}
.stat-box.up-card::before { background:var(--up); }
.stat-box.down-card::before { background:var(--down); }
.stat-box .lbl { font-size:11px; color:var(--muted); font-weight:500; }
.stat-box .val { font-size:22px; font-weight:700; margin-top:4px; line-height:1; }

/* ── 테이블 ── */
.tbl-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.tbl { width:100%; border-collapse:collapse; }
.tbl thead th {
  padding:10px 14px; color:var(--muted); font-size:11px; font-weight:600;
  text-transform:uppercase; letter-spacing:.05em;
  background:var(--surface2); border-bottom:1px solid var(--border); text-align:left;
}
.th-sort { cursor:pointer; user-select:none; white-space:nowrap; transition:color .1s; }
.th-sort:hover { color:var(--accent); }
.tbl tbody td { padding:11px 14px; border-bottom:1px solid var(--border); font-size:13px; }
.tbl tbody tr:last-child td { border-bottom:none; }
.tbl tbody tr { transition:background .1s; }
.tbl tbody tr:hover td { background:rgba(88,166,255,.04); }
.tbl .rank { color:var(--muted); width:36px; font-size:12px; font-weight:600; }
.tbl .amount { text-align:right; font-variant-numeric:tabular-nums; }

/* ── 투자자 카드 ── */
.investor-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px; }
.investor-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.investor-card-head {
  padding:11px 14px; border-bottom:1px solid var(--border);
  font-weight:600; font-size:13px; display:flex; align-items:center;
  background:var(--surface2);
}
.investor-card table { width:100%; border-collapse:collapse; }
.investor-card td { padding:9px 14px; border-bottom:1px solid var(--border); font-size:13px; }
.investor-card tr:last-child td { border-bottom:none; }
.investor-card tbody tr { transition:background .1s; }
.investor-card tbody tr:hover td { background:rgba(88,166,255,.04); }
.theme-tag { font-size:11px; color:var(--muted); margin-top:2px; }

/* ── 차트 토글 ── */
.card-view-toggle {
  display:flex; border:1px solid var(--border); border-radius:6px;
  overflow:hidden; margin-left:auto;
}
.card-view-btn {
  padding:4px 12px; font-size:11px; font-weight:500;
  background:none; border:none; color:var(--muted); cursor:pointer;
  transition:background .1s, color .1s;
}
.card-view-btn.active { background:var(--accent); color:#fff; }
.card-view-btn:hover:not(.active) { background:var(--badge); color:var(--text); }
.card-chart-view { padding:16px; }

/* ── 배지 ── */
.badge {
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600;
}
.badge-in { background:var(--up-bg); color:var(--up); }
.badge-out { background:var(--down-bg); color:var(--down); }
.badge-re { background:rgba(88,166,255,.12); color:var(--accent); }

/* ── 색상 ── */
.up { color:var(--up); }
.down { color:var(--down); }
.muted { color:var(--muted); }
.stock-link { cursor:pointer; }
.stock-link:hover { color:var(--accent); }
.stock-link:hover b { color:var(--accent); }

/* ── 기간 선택 ── */
.period-selector { display:flex; gap:10px; align-items:center; margin-bottom:20px; flex-wrap:wrap; }
.period-selector select {
  background:var(--surface2); border:1px solid var(--border);
  color:var(--text); padding:7px 12px; border-radius:6px; font-size:13px;
  cursor:pointer; outline:none; transition:border-color .15s;
}
.period-selector select:focus { border-color:var(--accent); }
.period-selector label { color:var(--muted); font-size:12px; font-weight:500; }
.month-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.month-tab {
  padding:5px 14px; background:var(--badge); border:1px solid var(--border);
  border-radius:20px; cursor:pointer; font-size:12px; color:var(--muted);
  transition:all .15s;
}
.month-tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.month-tab:hover:not(.active) { border-color:var(--accent); color:var(--accent); }

/* ── 로딩 / 빈 상태 ── */
.empty {
  color:var(--muted); padding:48px 20px; text-align:center; font-size:13px;
  display:flex; flex-direction:column; align-items:center; gap:8px;
}
.empty::before { content:'—'; font-size:24px; opacity:.3; }
.loading { color:var(--muted); padding:48px; text-align:center; }
.spinner {
  display:inline-block; width:16px; height:16px;
  border:2px solid var(--border); border-top-color:var(--accent);
  border-radius:50%; animation:spin .6s linear infinite; vertical-align:middle; margin-right:6px;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* ── 모달 ── */
#modal-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(1,4,9,.8); z-index:100;
  align-items:center; justify-content:center;
  backdrop-filter:blur(4px);
}
#modal-overlay.open { display:flex; }
#modal {
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:28px; width:min(760px,95vw);
  max-height:85vh; overflow-y:auto; position:relative;
  box-shadow:0 24px 64px rgba(0,0,0,.5);
}
#modal-close {
  position:absolute; top:16px; right:18px; background:var(--badge);
  border:1px solid var(--border); color:var(--muted); font-size:14px;
  width:28px; height:28px; border-radius:6px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background .1s, color .1s;
}
#modal-close:hover { background:var(--accent); border-color:var(--accent); color:#fff; }
#modal-title { font-size:16px; font-weight:700; margin-bottom:18px; padding-right:40px; }
.mstat-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
.mstat {
  background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; padding:12px 16px; flex:1; min-width:90px;
}
.mstat .lbl { font-size:11px; color:var(--muted); font-weight:500; }
.mstat .val { font-size:18px; font-weight:700; margin-top:4px; }

/* ── 스크롤바 ── */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--muted); }
</style>
</head>
<body>

<div id="modal-overlay">
  <div id="modal">
    <button id="modal-close" onclick="closeModal()">&#x2715;</button>
    <div id="modal-title"></div>
    <div id="modal-stats" class="mstat-row"></div>
    <div id="modal-history"></div>
  </div>
</div>

<header>
  <div class="logo">
    <span class="logo-icon">&#128202;</span>
    <h1>추적 60분</h1>
  </div>
  <div class="header-sep"></div>
  <div id="rt-status"><span class="pulse" style="display:none" id="pulse-dot"></span><span id="rt-text"></span></div>
  <button id="notif-btn" onclick="requestNotif()" title="브라우저 알림 허용">&#128276;</button>
  <span id="last-updated">&#8212;</span>
  <button class="hbtn" onclick="loadAll()">새로고침</button>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('realtime',this)">&#128225;&nbsp; 실시간 현황</div>
  <div class="tab" onclick="switchTab('intraday',this)">&#128225;&nbsp; 장중 투자자</div>
  <div class="tab" onclick="switchTab('daily',this)">&#128202;&nbsp; 투자자 TOP10</div>
  <div class="tab" onclick="switchTab('analysis',this)">&#128200;&nbsp; 분석 결과</div>
</div>

<div id="panel-realtime" class="panel active">
  <div id="rt-stats" class="stat-row"></div>
  <div class="sec-title">편입 중<span id="dur-note" style="text-transform:none;letter-spacing:0"></span></div>
  <div id="rt-active"><div class="loading"><span class="spinner"></span>불러오는 중...</div></div>
  <div class="sec-title" style="margin-top:32px">오늘 이탈</div>
  <div id="rt-exited"></div>
</div>

<div id="panel-intraday" class="panel">
  <div class="period-selector">
    <label>기준 시각</label>
    <select id="intraday-time-sel" onchange="_userPick.intraday=true;renderIntraday()"></select>
    <span class="muted" style="font-size:11px">장중투자자별매매상위(잠정) [1053] &middot; 10분 간격 &middot; 순매수 금액(백만원) 기준</span>
  </div>
  <div id="intraday-grid" class="investor-grid"><div class="loading"><span class="spinner"></span>불러오는 중...</div></div>
</div>

<div id="panel-daily" class="panel">
  <div class="period-selector">
    <label>날짜</label>
    <select id="daily-date-sel" onchange="_userPick.daily=true;renderDaily()"></select>
    <div class="card-view-toggle" style="margin-left:8px">
      <button id="daily-buy-btn" class="card-view-btn active" onclick="setDailyDir('순매수')">🟢 순매수</button>
      <button id="daily-sell-btn" class="card-view-btn" onclick="setDailyDir('순매도')">🔴 순매도</button>
    </div>
    <span class="muted" style="font-size:11px">매 영업일 18:30 갱신</span>
  </div>
  <div id="daily-grid" class="investor-grid"><div class="loading"><span class="spinner"></span>불러오는 중...</div></div>
</div>

<div id="panel-analysis" class="panel">
  <div class="period-selector">
    <label>기간</label>
    <select id="analysis-period-sel" onchange="_userPick.period=true;onPeriodChange()"></select>
    <label style="margin-left:8px">유형</label>
    <select id="analysis-type-sel" onchange="onPeriodChange()">
      <option value="total">전체기간</option>
      <option value="monthly">월별</option>
    </select>
  </div>
  <div id="month-tabs" class="month-tabs" style="display:none"></div>
  <div id="analysis-grid" class="investor-grid"><div class="loading"><span class="spinner"></span>불러오는 중...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script>
var SUPABASE_URL = "https://thhoydcjdxkvtpquaqwk.supabase.co";
var SUPABASE_KEY = "sb_publishable_Y_iy6oC680CLENegwsp0Dg_hMiaih0b";
var db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function today8() {
  var kst = new Date(Date.now() + 9 * 3600 * 1000);
  return kst.toISOString().slice(0,10).replace(/-/g,"");
}
function fmtAmount(raw) {
  if (raw == null) return "—";
  var sign = raw >= 0 ? "▲" : "▽";
  var a = Math.abs(raw);
  var jo = Math.floor(a/1000000), eok = Math.floor((a%1000000)/100), chun = Math.floor((a%100)/10);
  if (!jo && !eok && !chun) return sign + a + "백만원";
  var p = [];
  if (jo) p.push(jo + "조");
  if (eok) p.push(eok + "억");
  if (chun) p.push(chun + "천만원"); else if (p.length) p[p.length-1] += "원";
  return sign + p.join(" ");
}
var MARKET_OPEN_MIN  = 9 * 60;        // 09:00
var MARKET_CLOSE_MIN = 15 * 60 + 30;  // 15:30 장 마감
function fmtDur(entryTime) {
  if (!entryTime) return "—";
  var parts = entryTime.split(":");
  var eh = Number(parts[0]), em = Number(parts[1]);
  // 장 마감 후에는 15:30 기준으로 유지 시간 고정
  var now = new Date();
  var end = Math.min(now.getHours()*60 + now.getMinutes(), MARKET_CLOSE_MIN);
  var diff = end - (eh*60 + em);
  if (diff <= 0) return "0분";
  if (diff < 60) return diff + "분";
  return Math.floor(diff/60) + "h " + (diff%60) + "m";
}
function calcDur(et, xt) {
  if (!et || !xt) return "—";
  var ep = et.split(":"), xp = xt.split(":");
  var d = (Number(xp[0])*60 + Number(xp[1])) - (Number(ep[0])*60 + Number(ep[1]));
  if (d <= 0) return "—";
  if (d < 60) return d + "분";
  return Math.floor(d/60) + "h " + (d%60) + "m";
}
function fmtRate(v) {
  if (v == null) return '<span class="muted">—</span>';
  var cls = v >= 0 ? "up" : "down";
  return '<span class="' + cls + '">' + (v >= 0 ? "+" : "") + v + "%</span>";
}
function fmtPnl(ep, cp) {
  if (!ep || !cp) return '<span class="muted">—</span>';
  var pnl = (cp - ep) / ep * 100;
  var cls = pnl >= 0 ? "up" : "down";
  return '<span class="' + cls + '">' + (pnl >= 0 ? "+" : "") + pnl.toFixed(2) + "%</span>";
}
function setUpdated() {
  document.getElementById("last-updated").textContent = new Date().toLocaleTimeString("ko-KR") + " 갱신";
}

function switchTab(name, el) {
  document.querySelectorAll(".tab").forEach(function(t) { t.classList.remove("active"); });
  document.querySelectorAll(".panel").forEach(function(p) { p.classList.remove("active"); });
  el.classList.add("active");
  document.getElementById("panel-" + name).classList.add("active");
}

function updateNotifBtn() {
  var btn = document.getElementById("notif-btn");
  if (!("Notification" in window)) { btn.style.display = "none"; return; }
  if (Notification.permission === "granted") btn.classList.add("granted");
}
function requestNotif() {
  if (!("Notification" in window)) return;
  Notification.requestPermission().then(function() { updateNotifBtn(); });
}
function showNotif(title, body) {
  if (Notification.permission === "granted") new Notification(title, { body: body });
}
updateNotifBtn();

function closeModal() { document.getElementById("modal-overlay").classList.remove("open"); }
document.getElementById("modal-overlay").addEventListener("click", function(e) {
  if (e.target === document.getElementById("modal-overlay")) closeModal();
});

function openModal(code, name) {
  document.getElementById("modal-overlay").classList.add("open");
  document.getElementById("modal-title").textContent = name + "  (" + code + ")";
  document.getElementById("modal-stats").innerHTML = "";
  document.getElementById("modal-history").innerHTML = '<div class="loading"><span class="spinner"></span>불러오는 중...</div>';
  db.from("bot_entries").select("*").eq("code", code)
    .order("date", { ascending: false }).order("entry_time", { ascending: false }).limit(200)
    .then(function(res) {
      var data = res.data || [];
      if (!data.length) {
        var live = _active.find(function(s) { return s.code === code; });
        if (live) {
          var t = today8();
          var ds = t.slice(0,4)+"-"+t.slice(4,6)+"-"+t.slice(6);
          document.getElementById("modal-stats").innerHTML =
            '<div class="mstat"><div class="lbl">편입 발생일</div><div class="val">1일</div></div>' +
            '<div class="mstat"><div class="lbl">총 편입 횟수</div><div class="val">1회</div></div>';
          document.getElementById("modal-history").innerHTML =
            "<div class='tbl-wrap'><table class='tbl'><thead><tr><th>날짜</th><th>상태</th><th>편입</th><th>편입가</th><th>이탈</th><th>이탈가</th><th>유지</th></tr></thead><tbody>" +
            "<tr><td class='muted' style='font-size:12px;white-space:nowrap'>" + ds + "</td>" +
            "<td><span class='badge badge-in'>&#9650; 편입</span></td>" +
            "<td>" + (live.entry_time||"—") + "</td>" +
            "<td>" + (live.entry_price!=null?live.entry_price.toLocaleString():"—") + "</td>" +
            "<td class='muted'>—</td><td class='muted'>—</td><td class='muted'>편입 중</td></tr>" +
            "</tbody></table></div>";
        } else {
          document.getElementById("modal-history").innerHTML = '<div class="empty">편입 이력 없음</div>';
        }
        return;
      }
      var days = new Set(data.map(function(r) { return r.date; })).size;
      var withExit = data.filter(function(r) { return r.entry_time && r.exit_time; });
      var avgDur = null;
      if (withExit.length) {
        var tot = withExit.reduce(function(s,r) {
          var ep = r.entry_time.split(":"), xp = r.exit_time.split(":");
          return s + (Number(xp[0])*60+Number(xp[1])) - (Number(ep[0])*60+Number(ep[1]));
        }, 0);
        avgDur = Math.round(tot / withExit.length);
      }
      var sh = '<div class="mstat"><div class="lbl">편입 발생일</div><div class="val">' + days + '일</div></div>';
      sh += '<div class="mstat"><div class="lbl">총 편입 횟수</div><div class="val">' + data.length + '회</div></div>';
      if (avgDur !== null) sh += '<div class="mstat"><div class="lbl">평균 유지시간</div><div class="val">' + avgDur + '분</div></div>';
      document.getElementById("modal-stats").innerHTML = sh;
      var rows = data.map(function(r) {
        var dur = calcDur(r.entry_time, r.exit_time);
        var ds = r.date ? (r.date.slice(0,4)+"-"+r.date.slice(4,6)+"-"+r.date.slice(6)) : "—";
        var badge = r.status === "in"
          ? (r.exit_count > 0 ? '<span class="badge badge-re">&#128260; 재편입</span>'
                              : '<span class="badge badge-in">&#9650; 편입</span>')
          : '<span class="badge badge-out">&#9660; 이탈</span>';
        var entryCell = (r.entry_time||"—") + (r.reentry_time
          ? "<br><span class='muted' style='font-size:11px'>&#8635; " + r.reentry_time + "</span>" : "");
        return "<tr><td class='muted' style='font-size:12px;white-space:nowrap'>" + ds + "</td><td>" + badge + "</td><td>" + entryCell + "</td><td>" + (r.entry_price!=null?r.entry_price.toLocaleString():"—") + "</td><td>" + (r.exit_time||"—") + "</td><td>" + (r.exit_price!=null?r.exit_price.toLocaleString():"—") + "</td><td class='muted'>" + dur + "</td></tr>";
      }).join("");
      document.getElementById("modal-history").innerHTML =
        "<div class='tbl-wrap'><table class='tbl'><thead><tr><th>날짜</th><th>상태</th><th>편입 / &#8635;재편입</th><th>편입가</th><th>이탈</th><th>이탈가</th><th>유지</th></tr></thead><tbody>" + rows + "</tbody></table></div>";
    });
}

var _active = [], _exited = [], _intraday = [], _daily = [], _analysis = [];
var _meta = {};   // code|condition_name → bot_entries 행 (재편입 판별용)
var _userPick = { daily:false, intraday:false, period:false };
var _rtSubscribed = false;
var _sort = { active:{key:"entry_time",dir:1}, exited:{key:"exit_time",dir:-1} };

function t2m(t) { if (!t) return null; var p=t.split(":"); return Number(p[0])*60+Number(p[1]); }
function nowMin() { var n=new Date(); return n.getHours()*60+n.getMinutes(); }
function effNowMin() { return Math.min(nowMin(), MARKET_CLOSE_MIN); }
function sortVal(row, key, which) {
  switch (key) {
    case "name":       return row.name || row.code || "";
    case "entry_time": return t2m(row.entry_time);
    case "exit_time":  return t2m(row.exit_time);
    case "dur":
      if (which === "active") {
        var et = row.reentry_time || row.entry_time;
        return et ? effNowMin()-t2m(et) : null;
      }
      return (row.entry_time && row.exit_time) ? t2m(row.exit_time)-t2m(row.entry_time) : null;
    default: return row[key];
  }
}
function applySort(arr, which) {
  var s = _sort[which];
  if (!s.key) return arr;
  return arr.slice().sort(function(a,b) {
    var va = sortVal(a,s.key,which), vb = sortVal(b,s.key,which);
    if (va==null && vb==null) return 0;
    if (va==null) return 1;
    if (vb==null) return -1;
    if (typeof va === "string") return s.dir * va.localeCompare(vb,"ko");
    return s.dir * (va-vb);
  });
}
function setSort(which, key) {
  var s = _sort[which];
  if (s.key === key) s.dir = -s.dir; else { s.key = key; s.dir = 1; }
  renderRealtime();
}
function thSort(which, key, label) {
  var s = _sort[which];
  var arrow = s.key===key ? (s.dir===1 ? " &#9650;" : " &#9660;") : "";
  return "<th class='th-sort' onclick=\"setSort('"+which+"','"+key+"')\">"+label+arrow+"</th>";
}

function loadRealtime() {
  var t = today8();
  return Promise.all([
    db.from("realtime_status").select("*").eq("date", t).order("entry_time"),
    db.from("bot_entries").select("*").eq("date", t).limit(1000)
  ]).then(function(r) {
    _active = r[0].data||[];
    var entries = r[1].data||[];
    _meta = {};
    entries.forEach(function(e) { _meta[e.code + '|' + (e.condition_name||'')] = e; });
    var activeKeys = new Set(_active.map(function(s) { return s.code + '|' + (s.condition_name||''); }));
    _exited = entries.filter(function(e) {
      return e.status === "out" && !activeKeys.has(e.code + '|' + (e.condition_name||''));
    });
  });
}

function renderRealtime() {
  var total = _active.length + _exited.length;
  var nm = nowMin(), stateLbl, stateCls;
  if (nm < MARKET_OPEN_MIN)       { stateLbl = "장 시작 전"; stateCls = "muted"; }
  else if (nm >= MARKET_CLOSE_MIN){ stateLbl = "장 종료";    stateCls = "down"; }
  else                            { stateLbl = "장중";       stateCls = "up"; }
  document.getElementById("rt-stats").innerHTML =
    '<div class="stat-box ' + (stateCls==="up"?"up-card":stateCls==="down"?"down-card":"") + '"><div class="lbl">장 상태</div><div class="val ' + stateCls + '" style="font-size:18px;line-height:22px">' + stateLbl + '</div></div>' +
    '<div class="stat-box up-card"><div class="lbl">편입 중</div><div class="val up">' + _active.length + '</div></div>' +
    '<div class="stat-box down-card"><div class="lbl">오늘 이탈</div><div class="val down">' + _exited.length + '</div></div>' +
    '<div class="stat-box"><div class="lbl">총 포착</div><div class="val">' + total + '</div></div>';
  document.getElementById("dur-note").textContent =
    nm >= MARKET_CLOSE_MIN ? "유지 시간 15:30 마감 기준" : "";
  updateMarketIndicator();

  var actEl = document.getElementById("rt-active");
  if (!_active.length) {
    actEl.innerHTML = '<div class="empty">현재 편입 중인 종목 없음</div>';
  } else {
    var rows = applySort(_active, "active").map(function(s) {
      var sn = (s.name||s.code).replace(/'/g,"\\'");
      var ep = s.entry_price != null ? s.entry_price.toLocaleString() : "—";
      var m  = _meta[s.code + '|' + (s.condition_name||'')];
      var reBadge = (m && m.exit_count > 0)
        ? ' <span class="badge badge-re">&#128260; 재편입' + (m.exit_count>1 ? ' '+m.exit_count+'회' : '') + '</span>' : '';
      // 유지 시간은 현재 편입 구간(재편입 있으면 재편입 시각) 기준
      var durTime = s.reentry_time || s.entry_time;
      var entryCell = (s.entry_time||"—") + (s.reentry_time
        ? "<br><span class='muted' style='font-size:11px'>&#8635; " + s.reentry_time + " 재편입</span>" : "");
      return "<tr><td class='stock-link' onclick=\"openModal('" + s.code + "','" + sn + "')\">" +
        "<b>" + (s.name||s.code) + "</b>" + reBadge + "<br><span class='muted' style='font-size:11px'>" + s.code + " &nbsp;&middot;&nbsp; " + (s.condition_name||"") + "</span></td>" +
        "<td style='white-space:nowrap'>" + entryCell + "</td>" +
        "<td class='dur-cell muted' data-entry='" + (durTime||"") + "'>" + fmtDur(durTime) + "</td>" +
        "<td style='font-variant-numeric:tabular-nums'>" + ep + "</td></tr>";
    }).join("");
    actEl.innerHTML = "<div class='tbl-wrap'><table class='tbl'><thead><tr>" +
      thSort("active","name","종목") + thSort("active","entry_time","편입 시각") +
      thSort("active","dur","유지 시간") + thSort("active","entry_price","편입가") +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>";
  }

  var exitEl = document.getElementById("rt-exited");
  if (!_exited.length) {
    exitEl.innerHTML = '<div class="empty">오늘 이탈 종목 없음</div>';
  } else {
    var rows2 = applySort(_exited, "exited").map(function(e) {
      var sn = (e.name||e.code).replace(/'/g,"\\'");
      return "<tr><td class='stock-link' onclick=\"openModal('" + e.code + "','" + sn + "')\">" +
        "<b>" + (e.name||e.code) + "</b><br><span class='muted' style='font-size:11px'>" + e.code + "</span></td>" +
        "<td style='white-space:nowrap'>" + (e.entry_time||"—") + "</td>" +
        "<td style='white-space:nowrap'>" + (e.exit_time||"—") + "</td>" +
        "<td class='muted'>" + calcDur(e.entry_time, e.exit_time) + "</td>" +
        "<td style='font-variant-numeric:tabular-nums'>" + (e.exit_price!=null?e.exit_price.toLocaleString():"—") + "</td></tr>";
    }).join("");
    exitEl.innerHTML = "<div class='tbl-wrap'><table class='tbl'><thead><tr>" +
      thSort("exited","name","종목") + thSort("exited","entry_time","편입 시각") +
      thSort("exited","exit_time","이탈 시각") + thSort("exited","dur","유지 시간") +
      thSort("exited","exit_price","이탈가") +
      "</tr></thead><tbody>" + rows2 + "</tbody></table></div>";
  }
}

function loadIntraday() {
  return db.from("intraday_investor").select("*").eq("date", today8())
    .order("recorded_at",{ascending:false}).limit(150)
    .then(function(res) { _intraday = res.data||[]; });
}

function fmtQty(v) {
  if (v == null) return '<span class="muted">—</span>';
  var cls = v >= 0 ? "up" : "down";
  return '<span class="' + cls + '">' + (v >= 0 ? "+" : "") + v.toLocaleString() + '</span>';
}

function renderIntradayTimeSel() {
  var sel = document.getElementById("intraday-time-sel");
  var prev = sel.value, times = [], seen = {};
  _intraday.forEach(function(r) { if (!seen[r.recorded_at]) { seen[r.recorded_at]=true; times.push(r.recorded_at); } });
  sel.innerHTML = times.map(function(t) {
    var d = new Date(t);
    var lbl = ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2);
    return "<option value='" + t + "'>" + lbl + "</option>";
  }).join("");
  if (_userPick.intraday && times.indexOf(prev) >= 0) sel.value = prev;
}

function renderIntraday() {
  var grid = document.getElementById("intraday-grid");
  if (!_intraday.length) {
    grid.innerHTML = '<div class="empty">오늘 장중 투자자 데이터 없음<br><span style="font-size:11px;margin-top:4px;display:block">장중(09:00~15:30) 10분 간격으로 봇이 자동 수집합니다</span></div>';
    return;
  }
  var t = document.getElementById("intraday-time-sel").value;
  var rows = _intraday.filter(function(r) { return r.recorded_at === t; });
  var order = ["외국인","투신","연기금"];
  rows.sort(function(a,b) { return order.indexOf(a.investor_type) - order.indexOf(b.investor_type); });
  var icons = { "외국인":"&#127757;", "투신":"&#127974;", "연기금":"&#128309;" };
  grid.innerHTML = rows.map(function(r) {
    var trs = (r.stocks||[]).map(function(s) {
      var sn = (s.name||s.code).replace(/'/g,"\\'");
      return "<tr><td class='rank'>" + s.rank + "</td>" +
        "<td class='stock-link' onclick=\"openModal('" + s.code + "','" + sn + "')\">" +
        (s.name||s.code) + "<br><span class='muted' style='font-size:11px'>" + s.code + "</span></td>" +
        "<td class='amount'>" + fmtAmount(s.net_buy) + "</td></tr>";
    }).join("");
    return "<div class='investor-card'><div class='investor-card-head'><span>" +
      (icons[r.investor_type]||"") + " " + r.investor_type + " 순매수(잠정)</span></div>" +
      "<table><tbody>" + trs + "</tbody></table></div>";
  }).join("") || '<div class="empty">데이터 없음</div>';
}

var _charts={}, _chartData={};
function renderBarChart(id, labels, amounts) {
  if (_charts[id]) { _charts[id].destroy(); delete _charts[id]; }
  var ctx = document.getElementById(id); if (!ctx) return;
  _charts[id] = new Chart(ctx, {
    type:"bar", data:{ labels:labels, datasets:[{ data:amounts,
      backgroundColor:amounts.map(function(v){return v>=0?"rgba(63,185,80,.45)":"rgba(248,81,73,.45)";}),
      borderColor:amounts.map(function(v){return v>=0?"#3fb950":"#f85149";}),
      borderWidth:1, borderRadius:4 }]},
    options:{ indexAxis:"y", responsive:true,
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:function(c){return "  "+fmtAmount(c.raw);}}}},
      scales:{
        x:{ticks:{color:"#8b949e",font:{size:10}},grid:{color:"#21262d"}},
        y:{ticks:{color:"#c9d1d9",font:{size:12}},grid:{color:"rgba(0,0,0,0)"}}}}
  });
}
function showCardView(id, view, btn) {
  var card = document.getElementById(id);
  card.querySelector(".card-table-view").style.display = view==="table"?"":"none";
  card.querySelector(".card-chart-view").style.display = view==="chart"?"":"none";
  card.querySelectorAll(".card-view-btn").forEach(function(b){b.classList.remove("active");});
  btn.classList.add("active");
  if (view==="chart" && _chartData[id]) renderBarChart("chart-"+id, _chartData[id].labels, _chartData[id].amounts);
}
function makeInvestorCard(cid, type, items) {
  _chartData[cid] = { labels:items.map(function(r){return r.name||r.code;}).reverse(), amounts:items.map(function(r){return r.amount;}).reverse() };
  var trs = items.map(function(r) {
    var sn=(r.name||r.code).replace(/'/g,"\\'");
    var themes=r.themes?'<div class="theme-tag">'+r.themes+'</div>':"";
    var cls=(r.amount||0)>=0?"up":"down";
    return "<tr><td class='rank'>"+r.rank+"</td><td class='stock-link' onclick=\"openModal('"+r.code+"','"+sn+"')\">"+
      (r.name||r.code)+"<br><span class='muted' style='font-size:11px'>"+r.code+"</span>"+themes+"</td>"+
      "<td class='amount "+cls+"'>"+fmtAmount(r.amount)+"</td></tr>";
  }).join("");
  return "<div class='investor-card' id='"+cid+"'>" +
    "<div class='investor-card-head'><span>"+type+"</span>" +
    "<div class='card-view-toggle'>" +
    "<button class='card-view-btn active' onclick=\"showCardView('"+cid+"','table',this)\">표</button>" +
    "<button class='card-view-btn' onclick=\"showCardView('"+cid+"','chart',this)\">차트</button>" +
    "</div></div>" +
    "<div class='card-table-view'><table><tbody>"+trs+"</tbody></table></div>" +
    "<div class='card-chart-view' style='display:none'><canvas id='chart-"+cid+"'></canvas></div></div>";
}

function daysAgo8(n) {
  var kst = new Date(Date.now() + 9*3600*1000 - n*86400*1000);
  return kst.toISOString().slice(0,10).replace(/-/g,"");
}
function loadDaily() {
  // 최근 30일치만 조회 (하루 30행 → 행 수 무관하게 날짜 기준으로 보장)
  return db.from("investor_daily").select("*").gte("date", daysAgo8(30))
    .order("date",{ascending:false}).order("investor_type").order("rank").limit(2000)
    .then(function(res){_daily=res.data||[];});
}
function renderDailyDateSel() {
  var sel=document.getElementById("daily-date-sel");
  var prev=sel.value;
  var dates=[], seen={};
  _daily.forEach(function(r){if(!seen[r.date]){seen[r.date]=true;dates.push(r.date);}});
  dates.sort().reverse();
  sel.innerHTML=dates.map(function(d){
    return "<option value='"+d+"'>"+d.slice(0,4)+"-"+d.slice(4,6)+"-"+d.slice(6)+"</option>";
  }).join("");
  // 사용자가 직접 고른 경우만 선택 유지 – 새 날짜 데이터가 오면 자동으로 최신 표시
  if(_userPick.daily && dates.indexOf(prev)>=0) sel.value=prev;
}
var _dailyDir = "순매수";
function setDailyDir(dir){
  _dailyDir = dir;
  document.getElementById("daily-buy-btn").classList.toggle("active", dir==="순매수");
  document.getElementById("daily-sell-btn").classList.toggle("active", dir==="순매도");
  renderDaily();
}
function renderDaily() {
  var date=document.getElementById("daily-date-sel").value;
  // 마이그레이션 이전 데이터엔 trade_type이 없으므로 순매수로 간주
  var rows=_daily.filter(function(r){
    return r.date===date && (r.trade_type||"순매수")===_dailyDir;
  });
  var order=["외국인","투신","연기금"];
  if(!rows.length){
    var msg=_dailyDir==="순매도"?"순매도 데이터 없음 (이 날짜는 순매수만 수집됨)":"데이터 없음";
    document.getElementById("daily-grid").innerHTML='<div class="empty">'+msg+'</div>';return;
  }
  var types=[],seen={};
  rows.forEach(function(r){if(!seen[r.investor_type]){seen[r.investor_type]=true;types.push(r.investor_type);}});
  types.sort(function(a,b){return order.indexOf(a)-order.indexOf(b);});
  document.getElementById("daily-grid").innerHTML=types.map(function(t,i){
    return makeInvestorCard("daily-card-"+i,t,rows.filter(function(r){return r.investor_type===t;}).slice(0,10));
  }).join("");
}

function loadAnalysis() {
  return db.from("investor_analysis").select("*").order("period_end",{ascending:false}).order("investor_type").order("rank").limit(2000)
    .then(function(res){_analysis=res.data||[];});
}
function renderAnalysisPeriodSel() {
  var sel=document.getElementById("analysis-period-sel");
  var prev=sel.value;
  var seen={},periods=[];
  _analysis.forEach(function(r){
    var k=r.period_start+"_"+r.period_end;
    if(!seen[k]){seen[k]=true;
      var lbl=r.period_start.slice(0,4)+"-"+r.period_start.slice(4,6)+"-"+r.period_start.slice(6)+
        " ~ "+r.period_end.slice(0,4)+"-"+r.period_end.slice(4,6)+"-"+r.period_end.slice(6);
      periods.push({k:k,l:lbl});}
  });
  sel.innerHTML=periods.map(function(p){return "<option value='"+p.k+"'>"+p.l+"</option>";}).join("");
  if(_userPick.period && periods.some(function(p){return p.k===prev;})) sel.value=prev;
}
function onPeriodChange() {
  if(document.getElementById("analysis-type-sel").value==="monthly") {
    var pv=document.getElementById("analysis-period-sel").value;
    var ps=pv.split("_")[0],pe=pv.split("_")[1];
    var months=[],seenM={};
    _analysis.forEach(function(r){if(r.period_start===ps&&r.period_end===pe&&r.is_monthly&&!seenM[r.month]){seenM[r.month]=true;months.push(r.month);}});
    months.sort();
    var tabs=document.getElementById("month-tabs");
    tabs.style.display=months.length?"flex":"none";
    tabs.innerHTML=months.map(function(m,i){return "<div class='month-tab"+(i===0?" active":"")+"' onclick=\"selectMonth('"+m+"',this)\">"+m+"</div>";}).join("");
  } else { document.getElementById("month-tabs").style.display="none"; }
  renderAnalysis();
}
function selectMonth(m,el){
  document.querySelectorAll(".month-tab").forEach(function(t){t.classList.remove("active");});
  el.classList.add("active"); renderAnalysis();
}
function renderAnalysis() {
  var pv=document.getElementById("analysis-period-sel").value;
  if(!pv){document.getElementById("analysis-grid").innerHTML='<div class="empty">데이터 없음</div>';return;}
  var ps=pv.split("_")[0],pe=pv.split("_")[1];
  var isM=document.getElementById("analysis-type-sel").value==="monthly";
  var rows;
  if(isM){var a=document.querySelector(".month-tab.active"),m=a?a.textContent.trim():null;
    rows=_analysis.filter(function(r){return r.period_start===ps&&r.period_end===pe&&r.is_monthly&&r.month===m;});}
  else{rows=_analysis.filter(function(r){return r.period_start===ps&&r.period_end===pe&&!r.is_monthly;});}
  if(!rows.length){document.getElementById("analysis-grid").innerHTML='<div class="empty">데이터 없음</div>';return;}
  var types=[],seenT={};
  rows.forEach(function(r){if(!seenT[r.investor_type]){seenT[r.investor_type]=true;types.push(r.investor_type);}});
  document.getElementById("analysis-grid").innerHTML=types.map(function(t,i){
    return makeInvestorCard("analysis-card-"+i,t,rows.filter(function(r){return r.investor_type===t;}));
  }).join("");
}

function loadAll() {
  Promise.allSettled([loadRealtime(),loadIntraday(),loadDaily(),loadAnalysis()]).then(function(results){
    results.forEach(function(r,i){if(r.status==="rejected")console.error(["realtime","intraday","daily","analysis"][i],r.reason);});
    renderRealtime();
    renderIntradayTimeSel(); renderIntraday();
    renderDailyDateSel(); renderDaily();
    renderAnalysisPeriodSel(); onPeriodChange();
    setUpdated();
  });
}

db.channel("rt-status-ch")
  .on("postgres_changes",{event:"INSERT",schema:"public",table:"realtime_status"},function(p){
    showNotif("편입: "+(p.new.name||p.new.code),(p.new.condition_name||"")+" | "+(p.new.entry_time||""));
    loadRealtime().then(function(){renderRealtime();setUpdated();});
  })
  .on("postgres_changes",{event:"DELETE",schema:"public",table:"realtime_status"},function(){
    loadRealtime().then(function(){renderRealtime();setUpdated();});
  })
  .subscribe(function(status){
    _rtSubscribed = (status==="SUBSCRIBED");
    updateMarketIndicator();
  });

// 장 상태에 따라 헤더 표시등 갱신: 장중=녹색 점등 / 장 종료=빨간색(점등X)
function updateMarketIndicator(){
  var dot=document.getElementById("pulse-dot"), txt=document.getElementById("rt-text");
  if(!_rtSubscribed){ dot.style.display="none"; txt.textContent=""; return; }
  var nm=nowMin();
  dot.style.display="";
  if(nm>=MARKET_CLOSE_MIN){ dot.classList.add("closed");    txt.textContent="장 종료"; }
  else                    { dot.classList.remove("closed"); txt.textContent="실시간"; }
}

db.channel("bot-entries-ch")
  .on("postgres_changes",{event:"*",schema:"public",table:"bot_entries"},function(){
    loadRealtime().then(function(){renderRealtime();setUpdated();});
  }).subscribe();

loadAll();
setInterval(function(){
  document.querySelectorAll(".dur-cell").forEach(function(td){td.textContent=fmtDur(td.dataset.entry);});
},1000);
setInterval(loadAll,60000);
</script>
